name: Next.js application checks
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portfolio-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: faizan-ai-portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Content and integrity tests
        run: npm test
      - name: TypeScript checks
        run: npm run typecheck
      - name: ESLint checks
        run: npm run lint
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: 'http://localhost:3000'
